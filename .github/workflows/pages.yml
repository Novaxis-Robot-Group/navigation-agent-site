name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - site.js
      - favicon.svg
      - media/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6.0.0
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html styles.css site.js favicon.svg _site/
          if [ -d media ]; then
            cp -R media _site/media
          fi
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
